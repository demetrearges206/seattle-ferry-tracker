<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEA–BI Ferry">
  <meta name="theme-color" content="#060f1f">
  <title>Seattle ↔ Bainbridge Ferry</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-400-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-700-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --navy:       #060f1f;
      --navy-mid:   #0b1a30;
      --navy-card:  #0e2040;
      --navy-light: #162d52;
      --teal:       #00c9a7;
      --teal-glow:  rgba(0,201,167,0.12);
      --teal-dim:   rgba(0,201,167,0.18);
      --blue:       #2196f3;
      --amber:      #ffc947;
      --red:        #ff5449;
      --white:      #eef3ff;
      --mid:        #8099c0;
      --dim:        #3a5070;
      --border:     rgba(255,255,255,0.07);
      --radius:     14px;
      --st-sailing:   #58d8ae;
      --st-arriving:  #eec05b;
      --st-atdock:    #71bfff;
      --st-delayed:   #f08f47;
      --st-departed:  #8294a7;
      --st-oos:       #6c7680;
      --st-cancelled: #e9504d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .hdr {
      background: var(--navy-mid);
      border-bottom: 1px solid var(--border);
      padding: max(14px, env(safe-area-inset-top)) 18px 12px;
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .hdr-left { display: flex; flex-direction: column; gap: 3px; }
    .route-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1; color: #eef3ff; }
    .route-name .chevron { color: var(--teal); margin: 0 3px; font-size: 14.7px; }
    .live-row { display: flex; align-items: center; gap: 5px; font-size: 10.3px; color: var(--mid); }
    .build-tag { font-size: 10px; color: var(--dim); background: rgba(255,255,255,0.04); border-radius: 4px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
    .live-dot.live  { animation: livepulse 2s ease-in-out infinite; }
    .live-dot.stale   { background: var(--red);   animation: none; }
    .live-dot.partial { background: var(--amber); animation: none; }
    .live-dot.off     { background: var(--dim);   animation: none; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--mid);
      width: 36px; height: 36px; border-radius: 10px; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--teal-dim); color: var(--teal); }
    .icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Direction Tabs ──────────────────────────────────────── */
    .tabs { display: flex; background: var(--navy-mid); border-bottom: 1px solid var(--border); }
    .tab {
      flex: 1; padding: 11px 6px; background: none;
      border: none; border-bottom: 2px solid transparent;
      color: var(--mid); font-size: 12px; font-weight: 700; letter-spacing: 0.3px; line-height: 15px;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent; text-align: center; white-space: nowrap;
    }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); }

    /* ── Alerts section ─────────────────────────────────────── */
    .alerts-card {
      margin: 0 16px;
      border-radius: var(--radius);
      background: var(--navy-card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .alert-item {
      font-size: 13px; color: var(--text); line-height: 1.45;
    }
    .alert-item + .alert-item {
      border-top: 1px solid var(--border); padding-top: 10px;
    }
    .alert-empty {
      font-size: 13px; color: var(--mid);
    }

    /* ── Layout ──────────────────────────────────────────────── */
    .scroll-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .main {
      max-width: 520px; margin: 0 auto;
      padding: 0 0 max(40px, env(safe-area-inset-bottom));
    }

    /* ── Loading ─────────────────────────────────────────────── */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 64px 24px; color: var(--mid); font-size: 13px;
    }
    .ring {
      width: 36px; height: 36px; border: 3px solid var(--dim);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    /* ── Error ───────────────────────────────────────────────── */
    .err-card {
      margin: 16px; padding: 16px 18px; border-radius: var(--radius);
      background: rgba(255,84,73,0.08); border: 1px solid rgba(255,84,73,0.25);
      color: var(--red); font-size: 13px; line-height: 1.5;
    }
    .err-card small { display: block; margin-top: 4px; color: var(--mid); font-size: 11px; }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 48px 24px 24px; color: var(--mid); }
    .empty-state strong { display: block; font-size: 17px; color: var(--white); margin-bottom: 5px; }

    /* ── Next Ferry Hero ─────────────────────────────────────── */
    /* ── Featured vessel card ────────────────────────────── */
    .next-card {
      margin: 16px 16px 0; border-radius: 14px;
      background: #0e2040; border: 1px solid rgba(255,255,255,0.07);
      padding: 18px 20px 16px;
      display: flex; flex-direction: column; gap: 5px;
    }
    /* Header */
    .nc-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nc-vessel { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .nc-vessel-icon { font-size: 13px; color: var(--mid); flex-shrink: 0; }
    .nc-vessel-name {
      font-size: 14px; font-weight: 700; line-height: 17px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    /* Status badge */
    .nc-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; line-height: 13px;
      padding: 5px 10px; border-radius: 4px; letter-spacing: .2px; white-space: nowrap;
    }
    .nc-badge--sailing  { color: var(--st-sailing);  background: color-mix(in oklab, var(--st-sailing)  16%, transparent); }
    .nc-badge--arriving { color: var(--st-arriving); background: color-mix(in oklab, var(--st-arriving) 16%, transparent); }
    .nc-badge--atdock   { color: var(--st-atdock);   background: color-mix(in oklab, var(--st-atdock)   15%, transparent); }
    .nc-badge--delayed  { color: var(--st-delayed);  background: color-mix(in oklab, var(--st-delayed)  16%, transparent); }
    .nc-badge--departed { color: var(--st-departed); background: color-mix(in oklab, var(--st-departed) 18%, transparent); }
    .nc-badge--oos      { color: var(--st-oos);      background: color-mix(in oklab, var(--st-oos)      22%, transparent); }
    .nc-badge--cancelled{ color: var(--st-cancelled);background: color-mix(in oklab, var(--st-cancelled) 16%, transparent); }
    /* Countdown pill — hidden; nc-badge is the sole status indicator */
    .nc-pill { display: none; }
    /* Time block — SEA always left, BI always right */
    .nc-times { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 4px; }
    .nc-col-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.8px; line-height: 11px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .nc-col-time { display: flex; align-items: flex-end; gap: 1px; line-height: 1; }
    .nc-col-primary .nc-col-label { color: #fff; }
    .nc-col-primary .nc-t-big    { font-size: 42px; font-weight: 700; line-height: 1; color: #fff; }
    .nc-col-primary .nc-t-ampm   { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.3; }
    .nc-col-secondary .nc-col-label { color: var(--mid); }
    .nc-col-secondary .nc-t-big    { font-size: 24px; font-weight: 700; color: var(--mid); line-height: 1; }
    .nc-col-secondary .nc-t-ampm   { font-size: 24px; font-weight: 700; color: var(--mid); line-height: 1; }
    /* Route progress track */
    .nc-route-wrap { padding-top: 10px; }
    .nc-track-row { display: flex; align-items: flex-start; gap: 8px; }
    .nc-track-ep-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .nc-track-label { font-size: 10px; color: var(--mid); letter-spacing: .5px; font-weight: 600; }
    .nc-track-line {
      flex: 1; height: 3px; background: var(--dim);
      position: relative; border-radius: 2px; margin-top: 5.5px;
    }
    .nc-track-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: var(--vc); width: 0; }
    /* Endpoint dots */
    .ep-dot { position: relative; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
    .ep-core { width: 14px; height: 14px; border-radius: 50%; background: transparent; border: 2px solid var(--dim); box-sizing: border-box; }
    .ep-ring { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--vc); transform: translate(-50%,-50%); opacity: 0; pointer-events: none; }
    .ep-dot--hollow .ep-core { border-color: var(--dim); }
    .ep-dot--vring  .ep-core { border: 2px solid var(--vc); background: transparent; box-shadow: 0 0 7px color-mix(in oklab, var(--vc) 40%, transparent); }
    .ep-dot--docked .ep-core { border: none; background: var(--vc); box-shadow: 0 0 10px color-mix(in oklab, var(--vc) 60%, transparent); }
    .ep-dot--docked .ep-ring { animation: ncDockPulse 2.4s ease-out infinite; }
    .ep-dot--destination .ep-core { border: 2px solid var(--vc); background: color-mix(in oklab, var(--vc) 22%, transparent); box-shadow: 0 0 8px color-mix(in oklab, var(--vc) 45%, transparent); }
    .ep-dot--destination .ep-ring { animation: ncDestPulse 3.2s ease-out infinite; }
    @keyframes ncDestPulse {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: .5; }
      55%  { transform: translate(-50%,-50%) scale(1.85);opacity: 0;  }
      100% { transform: translate(-50%,-50%) scale(1.85);opacity: 0;  }
    }
    @keyframes ncDockPulse {
      0%   { transform: translate(-50%,-50%) scale(1);    opacity: .6; }
      70%  { transform: translate(-50%,-50%) scale(2.05); opacity: 0; }
      100% { transform: translate(-50%,-50%) scale(2.05); opacity: 0; }
    }
    .nc-vessel-pin {
      position: absolute; top: 1.5px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 4;
    }
    .nc-pin-icon {
      width: 36px; height: 36px; display: flex; align-items: center;
      justify-content: center; margin-top: -18px;
      color: var(--vc);
      filter:
        drop-shadow(0 0 6px  color-mix(in srgb, currentColor 55%, transparent))
        drop-shadow(0 0 14px color-mix(in srgb, currentColor 28%, transparent));
    }
    .nc-pin-icon svg { display: block; overflow: visible; }
    .nc-pin-time {
      font-size: 9.5px; font-weight: 700; color: #fff;
      background: rgba(8,18,38,.85); padding: 2px 6px; border-radius: 5px;
      white-space: nowrap; margin-top: 2px; border: 1px solid var(--border);
    }
    /* Next departure line */
    .nc-next-line {
      font-size: 10px; font-weight: 500; letter-spacing: 0.3px; color: var(--mid);
      padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); margin-top: 8px;
    }
    .nc-fallback-msg {
      font-size: 10px; font-weight: 500; letter-spacing: 0.3px; color: var(--mid);
      padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); margin-top: 1px;
    }

    /* ── Section label ───────────────────────────────────────── */
    .section-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.8px; line-height: 11px;
      text-transform: uppercase; color: var(--mid); padding: 16px 16px 10px;
    }

    /* ── Upcoming list ───────────────────────────────────────── */
    .upcoming-list { margin: 0 16px; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .sail-row {
      display: flex; justify-content: space-between;
      padding: 13px 16px; background: var(--navy-card);
      border-bottom: 1px solid var(--border);
    }
    .sail-row:last-child { border-bottom: none; }
    .sail-col { display: flex; flex-direction: column; gap: 4px; }
    .sail-vessel { font-size: 10.8px; font-weight: 700; color: var(--dim); line-height: 13px; }
    .sail-eta-lbl { font-size: 10.8px; font-weight: 700; color: var(--dim); line-height: 13px; }
    .sail-dep-time { display: flex; align-items: baseline; }
    .sail-dep-t { font-size: 14.1px; font-weight: 700; color: var(--white); line-height: 17px; }
    .sail-ampm { font-size: 11px; font-weight: 700; color: var(--white); }
    .sail-arr-row { display: flex; align-items: baseline; gap: 2px; }
    .sail-arrow { font-size: 15px; font-weight: 400; color: var(--mid); line-height: 18px; }
    .sail-arr-t { font-size: 14.1px; font-weight: 700; color: var(--mid); line-height: 17px; }
    .sail-arr-ampm { font-size: 11px; font-weight: 700; color: var(--mid); }
    .sail-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
    .delay-tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; background: rgba(255,84,73,0.15); color: var(--red); }
    .delay-tag.early { background: rgba(0,201,167,0.12); color: var(--teal); }
    .badge-dock     { background: rgba(255,201,71,0.15); color: var(--amber); }
    .badge-underway { background: var(--teal-glow); color: var(--teal); }

    /* ── Track vessel button + mini-map ─────────────────────── */
    .track-btn {
      width: 100%; margin-top: 12px; padding: 9px 14px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; color: var(--mid); font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: background 0.12s, color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .track-btn:active { background: rgba(255,255,255,0.08); }
    .track-btn.active { background: var(--teal-dim); color: var(--teal); border-color: rgba(0,201,167,0.3); }
    .mini-map-wrap {
      margin-top: 10px; border-radius: 10px; overflow: hidden;
      height: 0; transition: height 0.28s cubic-bezier(0.4,0,0.2,1);
      border: 0px solid var(--border);
    }
    .mini-map-wrap.open {
      height: 190px;
      border-width: 1px;
    }
    #miniMapEl { height: 190px; }

    /* ── Map ─────────────────────────────────────────────────── */
    .map-section { margin: 0 16px; }
    .map-frame { border-radius: var(--radius); border: 1px solid var(--border); height: 220px; position: relative; overflow: hidden; }
    #ferry-map-svg { display: block; width: 100%; height: 100%; }
    .map-popup {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      background: rgba(11,26,46,0.93); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 9px 12px 9px 12px; min-width: 134px;
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .map-popup.visible { opacity: 1; pointer-events: auto; }
    .map-popup-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; padding-right: 18px; }
    .map-popup-row { font-size: 11px; color: var(--mid); line-height: 1.75; }
    .map-popup-row b { color: var(--white); font-weight: 600; }
    .map-popup-close {
      position: absolute; top: 6px; right: 9px; font-size: 15px;
      color: var(--mid); cursor: pointer; line-height: 1;
    }


    /* ── Vessel chips ────────────────────────────────────────── */
    .vessel-live-strip {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
      padding: 0 16px; -webkit-overflow-scrolling: touch;
    }
    .vessel-live-strip::-webkit-scrollbar { display: none; }
    .vessel-chip {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      background: var(--navy-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; font-size: 12px;
      white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .vessel-chip:active { background: var(--navy-light); }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chip-dot.underway { background: var(--teal); }
    .chip-dot.docked   { background: var(--amber); }
    .chip-name { font-weight: 600; }
    .chip-sub  { color: var(--mid); font-size: 11px; }

    /* ── Full schedule ───────────────────────────────────────── */
    .sched-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: calc(100% - 32px); margin: 0 16px; padding: 14px 18px;
      background: var(--navy-card); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--white);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.12s; -webkit-tap-highlight-color: transparent;
    }
    .sched-toggle:active { background: var(--navy-light); }
    .sched-chevron { font-size: 12px; color: var(--mid); transition: transform 0.2s; }
    .sched-chevron.open { transform: rotate(180deg); }
    .sched-list {
      margin: 8px 16px 0; border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden; display: none;
    }
    .sched-list.open { display: block; }
    .sched-row {
      display: grid; grid-template-columns: 80px 1fr 100px; align-items: center;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--navy-card); font-size: 13px; gap: 6px;
    }
    .sched-row:last-child { border-bottom: none; }
    .sched-row.past { opacity: 0.3; }
    .sched-row.next-sail { background: var(--navy-light); border-left: 2px solid var(--teal); }
    .sched-t { font-weight: 700; }
    .sched-t small { font-size: 10px; font-weight: 500; color: var(--mid); }
    .sched-arr-t { color: var(--mid); font-size: 12px; }
    .sched-v { color: var(--dim); font-size: 11px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sched-note {
      font-size: 10px; color: var(--mid); padding: 8px 16px;
      background: var(--navy-mid); border-bottom: 1px solid var(--border); font-style: italic;
    }

    /* ── Home tip ────────────────────────────────────────────── */
    .home-tip {
      margin: 16px; padding: 12px 14px; border-radius: 10px;
      background: rgba(33,150,243,0.08); border: 1px solid rgba(33,150,243,0.2);
      font-size: 12px; color: var(--mid);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .home-tip-text span { color: var(--white); font-weight: 600; }
    .home-tip-close { background: none; border: none; color: var(--mid); font-size: 16px; cursor: pointer; flex-shrink: 0; padding: 0 4px; }
    .home-tip.hidden { display: none; }

    @media (min-width: 520px) { .nc-time-big { font-size: 52px; } }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <div class="route-name">Seattle <span class="chevron">↔</span> Bainbridge</div>
    <div class="live-row">
      <span class="live-dot off" id="liveDot"></span>

<script>
'use strict';

// ── Build version — bump this string on every deploy ─────
const BUILD = 'r70';

// ── Config ───────────────────────────────────────────────
const API_KEY   = 'ff39cd9c-729e-40ac-b740-1cebec6226f9';
const SCHED_BASE = 'https://www.wsdot.wa.gov/ferries/api/schedule/rest';
const TERM_BASE  = 'https://www.wsdot.wa.gov/ferries/api/terminals/rest';
const VESS_BASE  = 'https://www.wsdot.wa.gov/ferries/api/vessels/rest';

// Terminal IDs confirmed from WSDOT VesselWatch URL params
const TERMINALS = {
  SEA: { id: 7, name: 'Seattle',           abbrev: 'SEA', lat: 47.60328, lng: -122.33787 },
  BI:  { id: 3, name: 'Bainbridge Island', abbrev: 'BBI', lat: 47.62375, lng: -122.51044 },
};


// ── State ────────────────────────────────────────────────
let schedData    = null;
let vesselList   = [];
let routeId      = 9;       // overridden dynamically via schedroutes
let disruptions  = [];
let waitData     = [];
let bulletinData = [];
let direction    = 'SEA-BI';
let schedOpen        = false;
let vesselStripOpen  = false;
let cdTimer      = null;
let lastUpdate   = null;
let isLoading    = false;

// ── Utilities ────────────────────────────────────────────
function parseWSDot(s) {
  if (!s) return null;
  const m = String(s).match(/\/Date\((-?\d+)(?:[+-]\d{4})?\)\//);
  return m ? new Date(+m[1]) : null;
}
function fmtTime(d) {
  if (!d) return '—';
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
function splitTime(d) {
  if (!d) return { t: '—', ap: '' };
  const s = fmtTime(d).split(' ');
  return { t: s[0], ap: s[1] || '' };
}
function minsTo(d)   { return Math.round((d - Date.now()) / 60000); }
function elapsed(d)  {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m/60)}h ago`;
}
function countdownInfo(d) {
  const m = minsTo(d);
  if (m < -5)  return { text: 'Departed', cls: 'gone' };
  if (m < 0)   return { text: 'Leaving',  cls: 'now'  };
  if (m < 10)  return { text: `${m}m`,    cls: 'now'  };
  if (m < 30)  return { text: `${m}m`,    cls: 'soon' };
  const h = Math.floor(m / 60), rm = m % 60;
  return { text: h ? `${h}h ${rm}m` : `${m}m`, cls: '' };
}
function todayDateStr() {
  // WSF schedule day ends at 3 AM Pacific; before 3 AM use yesterday's date
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);
  const yyyy = d.getFullYear();
  const mm   = String(d.getMonth() + 1).padStart(2, '0');
  const dd   = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function getCachedSchedule() {
  try {
    const raw = localStorage.getItem('wsf_sched_v1');
    if (!raw) return null;
    const { date, data } = JSON.parse(raw);
    return date === todayDateStr() ? data : null;
  } catch { return null; }
}
function cacheSchedule(data) {
  try { localStorage.setItem('wsf_sched_v1', JSON.stringify({ date: todayDateStr(), data })); } catch {}
}

// ── API fetch with JSONP fallback ─────────────────────────
function jsonpFetch(url) {
  return new Promise((res, rej) => {
    const id = `_wsf_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const s = document.createElement('script');
    let tid;
    const cleanup = () => { delete window[id]; s.remove(); clearTimeout(tid); };
    tid = setTimeout(() => { rej(new Error('JSONP timeout')); cleanup(); }, 8000);
    window[id] = data => { res(data); cleanup(); };
    s.onerror = () => { rej(new Error('JSONP failed')); cleanup(); };
    s.src = `${url}&callback=${id}`;
    document.head.appendChild(s);
  });
}
async function apiFetch(url) {
  try {
    // No custom headers → avoids CORS preflight. Abort after 5s so JSONP starts quickly.
    const ac  = new AbortController();
    const tid = setTimeout(() => ac.abort(), 4000);
    try {
      const r = await fetch(url, { signal: ac.signal });
      clearTimeout(tid);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    } finally { clearTimeout(tid); }
  } catch {
    return jsonpFetch(url);
  }
}
function apiUrl(base, path) {
  return `${base}/${path}?apiaccesscode=${API_KEY}`;
}

// ── API calls ─────────────────────────────────────────────

// schedroutes: all scheduled routes + service disruptions
// Used to: (1) dynamically resolve the SEA-BI RouteID, (2) surface any active alerts
async function loadSchedRoutes() {
  return apiFetch(apiUrl(SCHED_BASE, 'schedroutes'));
}

// Primary: scheduletoday/{DepartingTerminalID}/{ArrivingTerminalID}/false
// Both directions fetched in parallel — no date required.
// Fallback: date-based schedule/{ISO-date}/{dep}/{arr} endpoints.
async function loadSchedule() {
  const cached = getCachedSchedule();
  if (cached) { setLoadingMsg('Schedule: from cache ✓'); return cached; }
  setLoadingMsg('Schedule API: trying scheduletoday/7/3…');
  const [p1, p2] = await Promise.allSettled([
    apiFetch(apiUrl(SCHED_BASE, `scheduletoday/${TERMINALS.SEA.id}/${TERMINALS.BI.id}/false`)),
    apiFetch(apiUrl(SCHED_BASE, `scheduletoday/${TERMINALS.BI.id}/${TERMINALS.SEA.id}/false`)),
  ]);
  const p1ok = p1.status === 'fulfilled', p2ok = p2.status === 'fulfilled';
  setLoadingMsg(`scheduletoday: SEA→BI ${p1ok ? '✓' : '✗'}, BI→SEA ${p2ok ? '✓' : '✗'}`);
  const combos = [];
  for (const r of [p1, p2]) {
    if (r.status !== 'fulfilled' || !r.value) continue;
    const v = r.value;
    combos.push(...(Array.isArray(v) ? v.flatMap(x => x.TerminalCombos || []) : (v.TerminalCombos || [])));
  }
  if (combos.length) {
    const result = { TerminalCombos: combos };
    cacheSchedule(result);
    setLoadingMsg(`Schedule loaded (${combos.length} combos) ✓`);
    return result;
  }

  // Fallback: date-specific endpoint (ISO date as path segment, confirmed by ferry.fyi + wsf-ferry-schedule)
  const td = todayDateStr();
  setLoadingMsg(`scheduletoday empty — trying schedule/${td}/7/3…`);
  const [r1, r2] = await Promise.allSettled([
    apiFetch(apiUrl(SCHED_BASE, `schedule/${td}/${TERMINALS.SEA.id}/${TERMINALS.BI.id}`)),
    apiFetch(apiUrl(SCHED_BASE, `schedule/${td}/${TERMINALS.BI.id}/${TERMINALS.SEA.id}`)),
  ]);
  const r1ok = r1.status === 'fulfilled', r2ok = r2.status === 'fulfilled';
  setLoadingMsg(`schedule/${td}: SEA→BI ${r1ok ? '✓' : '✗'}, BI→SEA ${r2ok ? '✓' : '✗'}`);
  for (const r of [r1, r2]) {
    if (r.status !== 'fulfilled' || !r.value) continue;
    const v = r.value;
    combos.push(...(Array.isArray(v) ? v.flatMap(x => x.TerminalCombos || []) : (v.TerminalCombos || [])));
  }
  if (combos.length) {
    setLoadingMsg(`Schedule loaded via fallback (${combos.length} combos) ✓`);
    const result = { TerminalCombos: combos };
    cacheSchedule(result);
    return result;
  }
  setLoadingMsg(`Both schedule endpoints returned empty — no combos`);
  return { TerminalCombos: combos };
}

// Live vessel positions for all WSF vessels
async function loadVessels() {
  return apiFetch(apiUrl(VESS_BASE, 'vessellocations'));
}

// Terminal wait times: car queue depth at each terminal dock
async function loadWaitTimes() {
  return apiFetch(apiUrl(TERM_BASE, 'terminalwaittimes'));
}

function fetchBulletins() {
  return apiFetch(apiUrl(SCHED_BASE, 'schedulebulletins'));
}

// ── Process schedroutes response ──────────────────────────
function processSchedRoutes(data) {
  if (!data || !Array.isArray(data)) return;

  // Find the SEA-BI route and extract its RouteID
  const seaBiRoute = data.find(r => {
    const abbr = (r.RouteAbbrev || '').toLowerCase();
    const desc = (r.Description || '').toLowerCase();
    return abbr === 'sea-bi' || (desc.includes('seattle') && desc.includes('bainbridge'));
  });
  if (seaBiRoute && seaBiRoute.RouteID) {
    routeId = seaBiRoute.RouteID;
  }

  // Collect service disruptions for this route
  disruptions = [];
  const routesToCheck = seaBiRoute ? [seaBiRoute] : data;
  routesToCheck.forEach(r => {
    if (!r.ServiceDisruptions) return;
    r.ServiceDisruptions.forEach(d => {
      if (d.DisruptionDescription || d.BulletinFlag) {
        disruptions.push({
          title: d.DisruptionDescription || 'Service Disruption',
          bulletin: d.BulletinFlag,
        });
      }
    });
  });
}

// ── Alerts ────────────────────────────────────────────────
function renderAlerts() {
  const wrap = document.getElementById('alertsContent');
  if (!wrap) return;

  const items = [];
  // Route service disruptions (from schedroutes)
  disruptions.forEach(d => items.push(d.title));
  // Bulletins from schedulebulletins API (filter to SEA-BI route)
  if (Array.isArray(bulletinData)) {
    bulletinData.forEach(b => {
      const text = (b.BulletinTitle || b.BulletinText || '').trim();
      if (!text) return;
      const route = (b.BulletinTitle || '').toLowerCase();
      if (route && !route.includes('sea') && !route.includes('bainbridge') && !route.includes('seattle')) return;
      if (!items.includes(text)) items.push(text);
    });
  }

  if (!items.length) {
    wrap.innerHTML = `<div class="alerts-card"><div class="alert-empty">No active alerts</div></div>`;
    return;
  }

  wrap.innerHTML = `<div class="alerts-card">${
    items.map(t => `<div class="alert-item">${t}</div>`).join('')
  }</div>`;
}

// ── Schedule parsing ──────────────────────────────────────
function getAllCombos() {
  if (!schedData) return [];
  if (Array.isArray(schedData)) return schedData.flatMap(s => s.TerminalCombos || []);
  return schedData.TerminalCombos || [];
}

function findCombo() {
  const combos = getAllCombos();
  const isSeaBi = direction === 'SEA-BI';
  // Try exact ID match first
  let c = combos.find(c =>
    isSeaBi
      ? (c.DepartingTerminalID === TERMINALS.SEA.id && c.ArrivingTerminalID === TERMINALS.BI.id)
      : (c.DepartingTerminalID === TERMINALS.BI.id  && c.ArrivingTerminalID === TERMINALS.SEA.id)
  );
  // Fall back to name matching
  if (!c) {
    c = combos.find(c => {
      const dep = (c.DepartingTerminalName || '').toLowerCase();
      const arr = (c.ArrivingTerminalName  || '').toLowerCase();
      return isSeaBi
        ? (dep.includes('seattle') && arr.includes('bainbridge'))
        : (dep.includes('bainbridge') && arr.includes('seattle'));
    });
  }
  return c || null;
}

const CROSSING_MS = 35 * 60 * 1000; // ~35 min crossing time

function getDepartures() {
  const combo = findCombo();
  if (!combo || !combo.Times) return [];
  return combo.Times
    .map(t => {
      const depart = parseWSDot(t.DepartingTime);
      // ArrivingTime is sometimes null; fall back to depart + 35 min
      const arrive = parseWSDot(t.ArrivingTime) || (depart ? new Date(depart.getTime() + CROSSING_MS) : null);
      return {
        depart, arrive,
        vessel: t.VesselName || '',
      };
    })
    .filter(t => t.depart)
    .sort((a, b) => a.depart - b.depart);
}

// Return the first scheduled departure in the opposite direction after `afterTime`
function getReturnDeparture(afterTime) {
  if (!afterTime) return null;
  const saved = direction;
  direction = (direction === 'SEA-BI') ? 'BI-SEA' : 'SEA-BI';
  const deps = getDepartures();
  direction = saved;
  return deps.find(d => d.depart > afterTime) || null;
}

function getScheduleNotes() {
  const combo = findCombo();
  return combo && combo.SailingNotes ? [combo.SailingNotes] : [];
}

// ── Per-vessel color ─────────────────────────────────────
// 8 perceptually distinct hues, roughly 45° apart, calibrated for dark backgrounds
const VESSEL_COLORS = {
  Tacoma:'#e2b93a', Wenatchee:'#73e087',
  Cathlamet:'#ff94ac', Chelan:'#ff978b', Chetzemoka:'#ff9e6a', Chimacum:'#fda84d',
  Issaquah:'#eab43b', Kaleetan:'#d0c141', Kennewick:'#afcc59', Kitsap:'#88d479',
  Kittitas:'#5ada9c', Puyallup:'#13dbbe', Salish:'#00d9de', Samish:'#00d4f9',
  Sealth:'#49cbff', Spokane:'#79c1ff', Suquamish:'#9fb6ff', Tillikum:'#c0abff',
  Tokitae:'#dba2ff', 'Walla Walla':'#f29aea', Yakima:'#ff95cd',
};
const VESSEL_RAMP = ['#ff94ac','#ff9e6a','#eab43b','#afcc59','#5ada9c','#13dbbe',
                     '#00d4f9','#49cbff','#9fb6ff','#c0abff','#dba2ff','#f29aea'];
function getVesselColor(name) {
  if (VESSEL_COLORS[name]) return VESSEL_COLORS[name];
  let h = 0; for (const c of name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return VESSEL_RAMP[h % VESSEL_RAMP.length];
}

// ── Mini-map inside Next Sailing card ────────────────────
let miniMap = null;

function closeMiniMap() {
  if (miniMap) {
    const container = miniMap.getContainer();
    miniMap.remove();
    if (container) delete container._leaflet_id;
    miniMap = null;
  }
}

function openMiniMap(vesselName) {
  if (miniMap) { miniMap.remove(); miniMap = null; }

  // Use a short timeout so the browser has committed the container's full height
  // before Leaflet measures it. rAF alone fires before paint on some mobile browsers.
  setTimeout(() => {
    const wrap = document.getElementById('miniMapWrap');
    const el   = document.getElementById('miniMapEl');
    if (!wrap || !el) return;

    // Force explicit height so Leaflet always measures 190px regardless of CSS state
    el.style.height = '190px';

    miniMap = L.map(el, {
      zoomControl: false, attributionControl: false,
      dragging: true, scrollWheelZoom: false, touchZoom: true,
    });
    L.geoJSON(PUGET_SOUND_LAND, { style: LAND_STYLE }).addTo(miniMap);

    L.polyline([
      [TERMINALS.SEA.lat, TERMINALS.SEA.lng],
      [TERMINALS.BI.lat,  TERMINALS.BI.lng],
    ], { color: 'rgba(0,201,167,0.6)', weight: 2.5, dashArray: '6 5' }).addTo(miniMap);

    const mkLabel = (t) => L.marker([t.lat, t.lng], {
      icon: L.divIcon({
        html: `<div style="background:#0b1a30;border:1.5px solid #00c9a7;border-radius:3px;padding:1px 5px;font-family:-apple-system,system-ui,sans-serif;font-size:9px;font-weight:700;color:#00c9a7;white-space:nowrap">${t.abbrev}</div>`,
        className: '', iconAnchor: [0, 0],
      }), interactive: false,
    }).addTo(miniMap);
    mkLabel(TERMINALS.SEA);
    mkLabel(TERMINALS.BI);

    const vessel = Array.isArray(vesselList) && vesselList.find(v => v.VesselName === vesselName && v.InService);
    if (vessel && vessel.Latitude && vessel.Longitude) {
      const color = getVesselColor(vesselName);
      const icon  = L.divIcon({
        html: `<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:${color}">
          <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
               style="transform:rotate(${vessel.Heading||0}deg);filter:drop-shadow(0 0 6px ${color}8c) drop-shadow(0 0 14px ${color}47);overflow:visible">
            <path fill="currentColor" d="M32 5 C 40 13, 44 21, 44 29 L 44 54 C 44 57, 42 59, 39 59 L 25 59 C 22 59, 20 57, 20 54 L 20 29 C 20 21, 24 13, 32 5 Z"/>
            <path fill="#0b1a2e" fill-opacity="0.32" d="M32 13 C 37.5 19, 40 25, 40 30 L 40 51 C 40 53, 38.5 54.5, 36.5 54.5 L 27.5 54.5 C 25.5 54.5, 24 53, 24 51 L 24 30 C 24 25, 26.5 19, 32 13 Z"/>
            <circle cx="32" cy="24" r="3.4" fill="#0b1a2e"/>
          </svg></div>`,
        className: '', iconSize: [32, 32], iconAnchor: [16, 16],
      });
      L.marker([vessel.Latitude, vessel.Longitude], { icon })
        .bindPopup(`<div style="font-weight:700;font-size:13px">⛴ ${vesselName}</div><div style="font-size:11px;color:#8099c0;margin-top:4px">${Math.round(vessel.Speed||0)} kts · ${Math.round(vessel.Heading||0)}°</div>`, { closeButton: false })
        .addTo(miniMap);
      miniMap.setView([vessel.Latitude, vessel.Longitude], 11);
    } else {
      miniMap.fitBounds([[TERMINALS.SEA.lat, TERMINALS.SEA.lng],[TERMINALS.BI.lat, TERMINALS.BI.lng]], { padding: [20,20] });
    }

    setTimeout(() => miniMap && miniMap.invalidateSize({ reset: true }), 200);
  }, 50);
}

// ── Live vessel helpers ───────────────────────────────────
function getLiveVessel(name) {
  if (!name || !Array.isArray(vesselList)) return null;
  return vesselList.find(v => v.VesselName === name && v.InService) || null;
}

function routeVessels() {
  if (!Array.isArray(vesselList)) return [];
  return vesselList.filter(v =>
    v.InService &&
    ((v.DepartingTerminalID === TERMINALS.SEA.id || v.ArrivingTerminalID === TERMINALS.SEA.id) &&
     (v.DepartingTerminalID === TERMINALS.BI.id  || v.ArrivingTerminalID === TERMINALS.BI.id))
  );
}

function vesselStatus(lv) {
  if (!lv) return null;
  if (lv.AtDock) return { text: 'At Dock', cls: 'badge-dock' };
  const eta = parseWSDot(lv.Eta);
  if (eta && minsTo(eta) <= 5) return { text: 'Arriving', cls: 'badge-underway' };
  return { text: 'Sailing', cls: 'badge-underway' };
}

// ── Render schedule ───────────────────────────────────────
function renderSchedule() {
  const featWrap = document.getElementById('schedFeatured');
  const wrap     = document.getElementById('schedContent');
  const departures = getDepartures();

  if (!departures.length) {
    featWrap.innerHTML = `<div class="empty-state"><strong>No sailings found</strong>Check back tomorrow</div>`;
    wrap.innerHTML = '';
    return;
  }

  const upcoming = departures.filter(d => minsTo(d.depart) > -5);
  if (!upcoming.length) {
    featWrap.innerHTML = `<div class="empty-state"><strong>No more sailings today</strong>Last ferry has departed</div>`;
    wrap.innerHTML = '';
    renderFullSched(wrap, departures, null);
    return;
  }

  const next = upcoming[0];
  const rest = upcoming.slice(0, 3);
  const lv = getLiveVessel(next.vessel);

  // Only use live data if the vessel is heading toward the correct destination for this tab
  const dirDep = direction === 'SEA-BI' ? TERMINALS.SEA.id : TERMINALS.BI.id;
  const dirArr = direction === 'SEA-BI' ? TERMINALS.BI.id  : TERMINALS.SEA.id;
  const lvOnRoute = lv && !lv.AtDock &&
    lv.DepartingTerminalID === dirDep && lv.ArrivingTerminalID === dirArr;
  const liveEta = lvOnRoute ? parseWSDot(lv.Eta) : null;

  // Vessel sailing the opposite direction, heading toward our departure terminal
  const lvApproaching = lv && !lv.AtDock && !lvOnRoute &&
    lv.DepartingTerminalID === dirArr && lv.ArrivingTerminalID === dirDep;
  const approachEta = lvApproaching ? parseWSDot(lv.Eta) : null;

  // Vessel is docked but at the ARRIVAL terminal (wrong side) — needs to cross first
  const lvAtOther = lv && lv.AtDock && lv.DepartingTerminalID === dirArr;

  // ── Determine card state ───────────────────────────────
  // Check OOS without the InService filter getLiveVessel applies
  const lvAny = Array.isArray(vesselList) ? vesselList.find(v => v.VesselName === next.vessel) : null;

  let cardState;
  if (lvAny && !lvAny.InService) {
    cardState = 'oos';
  } else if (!lv) {
    cardState = 'fallback';
  } else if (lv.AtDock) {
    cardState = 'at-dock';
  } else if (lvApproaching) {
    cardState = minsTo(approachEta) <= 5 ? 'arriving' : 'sailing';
  } else if (!lvOnRoute) {
    cardState = 'at-dock';
  } else if (liveEta && minsTo(liveEta) <= 5) {
    cardState = 'arriving';
  } else if (liveEta && next.arrive && (liveEta - next.arrive) > 5 * 60 * 1000) {
    cardState = 'delayed';
  } else {
    cardState = 'sailing';
  }

  // oos behaves like at-dock for layout: show scheduled times, hide pin
  const atDock      = cardState === 'at-dock' || cardState === 'oos';
  const isArriving  = cardState === 'arriving';
  const arriveTime  = lvApproaching ? approachEta : (liveEta || next.arrive);
  const actualDepart = lvApproaching
    ? ((lv && lv.LeftDock) ? parseWSDot(lv.LeftDock) : null)
    : ((!atDock && lvOnRoute && lv && lv.LeftDock) ? parseWSDot(lv.LeftDock) : next.depart);
  const cdTarget    = atDock ? next.depart : arriveTime;
  const destName    = direction === 'SEA-BI' ? 'Bainbridge' : 'Seattle';
  const depTermName = direction === 'SEA-BI' ? 'Seattle' : 'Bainbridge';
  const returnDep   = (!lvApproaching && cardState !== 'fallback') ? getReturnDeparture(arriveTime) : null;
  const footerText  = lvApproaching
    ? `Next: Departs ${depTermName} · ${fmtTime(next.depart)}`
    : (returnDep ? `Next: Departs ${destName} · ${fmtTime(returnDep.depart)}` : null);

  // ── SEA (left) and BI (right) column values ─────────────
  // SEA is always on the left, BI always on the right.
  // Primary = the "focus" terminal (where ferry is for at-dock; destination when underway).
  let seaLabel, seaTime, seaPrimary;
  let biLabel, biTime, biPrimary;
  if (direction === 'SEA-BI') {
    if (atDock) {
      if (lvAtOther) {
        // Vessel docked at BBI (will cross to SEA first before this SEA→BBI trip)
        biLabel  = 'AT BBI';      biTime  = null;         biPrimary  = false;
        seaLabel = 'DEPARTS SEA'; seaTime = next.depart;  seaPrimary = true;
      } else {
        seaLabel = 'DEPARTS SEA'; seaTime = next.depart; seaPrimary = true;
        biLabel  = 'ARRIVES BBI'; biTime  = next.arrive; biPrimary  = false;
      }
    } else if (lvApproaching) {
      // Vessel sailing BBI→SEA, approaching SEA for upcoming SEA→BBI departure
      biLabel  = 'DEPARTED BBI'; biTime  = actualDepart || next.depart; biPrimary  = false;
      seaLabel = 'ARRIVES SEA';  seaTime = approachEta;                 seaPrimary = true;
    } else {
      seaLabel = 'DEPARTED SEA'; seaTime = actualDepart; seaPrimary = false;
      biLabel  = 'ARRIVES BBI';  biTime  = arriveTime;   biPrimary  = true;
    }
  } else {
    if (atDock) {
      if (lvAtOther) {
        // Vessel docked at SEA (will cross to BBI first before this BBI→SEA trip)
        seaLabel = 'AT SEA';       seaTime = null;         seaPrimary = false;
        biLabel  = 'DEPARTS BBI';  biTime  = next.depart;  biPrimary  = true;
      } else {
        biLabel  = 'DEPARTS BBI'; biTime  = next.depart; biPrimary  = true;
        seaLabel = 'ARRIVES SEA'; seaTime = next.arrive;  seaPrimary = false;
      }
    } else if (lvApproaching) {
      seaLabel = 'DEPARTED SEA'; seaTime = actualDepart || next.depart; seaPrimary = false;
      biLabel  = 'ARRIVES BBI';  biTime  = approachEta;                 biPrimary  = true;
    } else {
      biLabel  = 'DEPARTED BBI'; biTime  = actualDepart; biPrimary  = false;
      seaLabel = 'ARRIVES SEA';  seaTime = arriveTime;   seaPrimary = true;
    }
  }
  const { t: seaT, ap: seaAp } = splitTime(seaTime);
  const { t: biT,  ap: biAp  } = splitTime(biTime);

  // ── Route progress bar (0–100 %, SEA=0, BI=100) ─────────
  // Position = fraction of trip elapsed, derived from time remaining so it
  // stays in sync with the live ETA pill even when LeftDock is unavailable.
  const scheduledTripMs = next.arrive - next.depart;
  const computeBarPct = () => {
    if (atDock) return direction === 'SEA-BI' ? 3 : 97;
    const totalTrip = (lvApproaching && actualDepart && approachEta)
      ? approachEta - actualDepart
      : scheduledTripMs;
    if (totalTrip <= 0) return 50;
    const remaining = cdTarget - Date.now();
    const pct = Math.max(3, Math.min(97, (1 - remaining / totalTrip) * 100));
    // lvApproaching: vessel travels in OPPOSITE direction, so invert the direction check
    const isForward = lvApproaching ? direction === 'BI-SEA' : direction === 'SEA-BI';
    return isForward ? pct : (100 - pct);
  };
  const barPct    = computeBarPct();
  const ferryRot  = ((direction === 'SEA-BI') !== lvApproaching) ? 90 : -90;
  const vesselClr = getVesselColor(next.vessel);
  const ferryPinSvg = `<svg width="34" height="34" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
    style="transform:rotate(${ferryRot}deg);overflow:visible;display:block">
    <path fill="currentColor" d="M32 5 C 40 13, 44 21, 44 29 L 44 54 C 44 57, 42 59, 39 59 L 25 59 C 22 59, 20 57, 20 54 L 20 29 C 20 21, 24 13, 32 5 Z"/>
    <path fill="#0b1a2e" fill-opacity="0.32" d="M32 13 C 37.5 19, 40 25, 40 30 L 40 51 C 40 53, 38.5 54.5, 36.5 54.5 L 27.5 54.5 C 25.5 54.5, 24 53, 24 51 L 24 30 C 24 25, 26.5 19, 32 13 Z"/>
    <circle cx="32" cy="24" r="3.4" fill="#0b1a2e"/>
  </svg>`;

  const isSeaBI   = direction === 'SEA-BI';
  // destIsBI: true when vessel is heading toward BI (XOR with lvApproaching which reverses it)
  const destIsBI  = isSeaBI !== Boolean(lvApproaching);
  const seaDotCls = cardState === 'at-dock'
    ? (lvAtOther
        ? (isSeaBI ? 'ep-dot--hollow' : 'ep-dot--docked')   // vessel at other terminal
        : (isSeaBI ? 'ep-dot--docked' : 'ep-dot--hollow'))  // vessel at dep terminal
    : cardState === 'fallback'
    ? 'ep-dot--hollow'
    : (destIsBI ? 'ep-dot--hollow' : 'ep-dot--destination');
  const biDotCls  = cardState === 'at-dock'
    ? (lvAtOther
        ? (isSeaBI ? 'ep-dot--docked' : 'ep-dot--hollow')   // vessel at other terminal
        : (isSeaBI ? 'ep-dot--hollow' : 'ep-dot--docked'))  // vessel at dep terminal
    : cardState === 'fallback'
    ? 'ep-dot--hollow'
    : (destIsBI ? 'ep-dot--destination' : 'ep-dot--hollow');
  const badgeCls = {
    'at-dock': 'nc-badge--atdock', 'sailing': 'nc-badge--sailing',
    'arriving': 'nc-badge--arriving', 'delayed': 'nc-badge--delayed',
    'oos': 'nc-badge--oos',
  }[cardState] || '';
  const pillCls  = { 'at-dock': 'nc-pill-dock', 'sailing': 'nc-pill-sailing', 'arriving': 'nc-pill-arriving' }[cardState] || '';
  const badgeText = {
    'at-dock': 'At Dock', 'sailing': 'Sailing', 'arriving': 'Arriving',
    'delayed': 'Delayed', 'oos': 'Out of service',
  }[cardState] || '';
  const cd = (cardState !== 'fallback') ? countdownInfo(cdTarget) : { text: '', cls: '' };

  // ── Featured card (renders into #schedFeatured) ────────
  if (cardState === 'fallback') {
    featWrap.innerHTML = '';
  } else {
    featWrap.innerHTML = `
      <div class="next-card" id="nextCard" data-state="${cardState}">
        <div class="nc-header">
          <div class="nc-vessel">
            <span class="nc-vessel-icon">⛴</span>
            <span class="nc-vessel-name" style="color:${vesselClr}">${next.vessel || 'Vessel TBD'}</span>
            <span class="nc-badge ${badgeCls}">${badgeText}</span>
          </div>
          <div class="nc-pill ${pillCls}" id="cdPill">${cd.text}</div>
        </div>
        <div class="nc-times">
          <div class="nc-col ${seaPrimary ? 'nc-col-primary' : 'nc-col-secondary'}">
            <div class="nc-col-label">${seaLabel}</div>
            <div class="nc-col-time">
              <span class="nc-t-big">${seaT}</span><span class="nc-t-ampm">${seaAp}</span>
            </div>
          </div>
          <div class="nc-col ${biPrimary ? 'nc-col-primary' : 'nc-col-secondary'}">
            <div class="nc-col-label">${biLabel}</div>
            <div class="nc-col-time">
              <span class="nc-t-big">${biT}</span><span class="nc-t-ampm">${biAp}</span>
            </div>
          </div>
        </div>
        <div class="nc-route-wrap">
          <div class="nc-track-row" style="--vc:${vesselClr}">
            <div class="nc-track-ep-wrap">
              <div class="ep-dot ${seaDotCls}"><div class="ep-core"></div><div class="ep-ring"></div></div>
              <span class="nc-track-label">SEA</span>
            </div>
            <div class="nc-track-line">
              <div class="nc-track-fill" id="ncTrackFill" style="${atDock ? 'width:0' : isSeaBI ? 'left:0;width:'+barPct.toFixed(1)+'%' : 'left:'+barPct.toFixed(1)+'%;width:'+(100-barPct).toFixed(1)+'%'}"></div>
              <div class="nc-vessel-pin" id="ncPin" style="${atDock ? 'display:none' : 'left:'+barPct.toFixed(1)+'%'}">
                <div class="nc-pin-icon">${ferryPinSvg}</div>
                ${!atDock ? `<div class="nc-pin-time" id="ncPinTime">${cd.text}</div>` : ''}
              </div>
            </div>
            <div class="nc-track-ep-wrap">
              <div class="ep-dot ${biDotCls}"><div class="ep-core"></div><div class="ep-ring"></div></div>
              <span class="nc-track-label">BBI</span>
            </div>
          </div>
          ${footerText ? `<div class="nc-next-line">${footerText}</div>` : ''}
        </div>
      </div>`;
  }

  // ── Upcoming + full schedule (renders into #schedContent) ─
  let html = '';

  if (rest.length) {
    html += `<div class="section-label">Upcoming</div><div class="upcoming-list">`;
    rest.forEach(d => {
      const { t, ap } = splitTime(d.depart);
      const { t: at, ap: aap } = splitTime(d.arrive);
      html += `
        <div class="sail-row">
          <div class="sail-col">
            <div class="sail-vessel">${d.vessel}</div>
            <div class="sail-dep-time"><span class="sail-dep-t">${t}</span><span class="sail-ampm"> ${ap}</span></div>
          </div>
          <div class="sail-col">
            <div class="sail-eta-lbl">ETA</div>
            <div class="sail-arr-row"><span class="sail-arrow">→</span><span class="sail-arr-t">${at}</span><span class="sail-arr-ampm"> ${aap}</span></div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  // Full schedule toggle
  const notes = getScheduleNotes();
  const total = departures.length;
  const remaining = upcoming.length;
  html += `
    <div class="section-label" style="margin-top:6px">Full Schedule</div>
    <button class="sched-toggle" id="schedToggle">
      <span>Today · ${total} sailings${remaining < total ? ` · ${remaining} remaining` : ''}</span>
      <span class="sched-chevron ${schedOpen ? 'open' : ''}" id="schedChevron">▼</span>
    </button>
    <div class="sched-list ${schedOpen ? 'open' : ''}" id="schedList">`;

  notes.forEach(n => { html += `<div class="sched-note">${n}</div>`; });
  departures.forEach(d => {
    const isPast = minsTo(d.depart) <= -5;
    const isNext = d === next;
    const { t, ap } = splitTime(d.depart);
    html += `
      <div class="sched-row ${isPast ? 'past' : ''} ${isNext ? 'next-sail' : ''}">
        <div class="sched-t">${t}<small> ${ap}</small></div>
        <div class="sched-arr-t">→ ${fmtTime(d.arrive)}</div>
        <div class="sched-v">${d.vessel}</div>
      </div>`;
  });
  html += `</div>`;

  wrap.innerHTML = html;

  document.getElementById('schedToggle').addEventListener('click', () => {
    schedOpen = !schedOpen;
    document.getElementById('schedList').classList.toggle('open', schedOpen);
    document.getElementById('schedChevron').classList.toggle('open', schedOpen);
  });

  const nextCardEl = document.getElementById('nextCard');
  function updateProgress() {
    if (!nextCardEl || cardState === 'fallback' || cardState === 'at-dock') return;
    const totalTrip = (lvApproaching && actualDepart && approachEta)
      ? approachEta - actualDepart
      : scheduledTripMs;
    if (totalTrip <= 0) return;
    const remaining = cdTarget - Date.now();
    let pct = Math.max(3, Math.min(97, (1 - remaining / totalTrip) * 100));
    const isForward = lvApproaching ? direction === 'BI-SEA' : direction === 'SEA-BI';
    if (!isForward) pct = 100 - pct;
    const pin  = document.getElementById('ncPin');
    const fill = document.getElementById('ncTrackFill');
    if (pin)  pin.style.left = pct.toFixed(1) + '%';
    if (fill) {
      if (isForward) {
        fill.style.left  = '0';
        fill.style.width = pct.toFixed(1) + '%';
      } else {
        fill.style.left  = pct.toFixed(1) + '%';
        fill.style.width = (100 - pct).toFixed(1) + '%';
      }
    }
  }
  updateProgress();

  if (cdTimer) clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    const pill = document.getElementById('cdPill');
    if (!pill) { clearInterval(cdTimer); return; }
    const { text } = countdownInfo(cdTarget);
    pill.textContent = text;
    const pinTime = document.getElementById('ncPinTime');
    if (pinTime) pinTime.textContent = text;
    updateProgress();
  }, 10000);
}

// ── Vessel strip ──────────────────────────────────────────
function renderVesselStrip() {
  const strip   = document.getElementById('vesselStrip');
  const chevron = document.getElementById('vesselChevron');
  const rv      = routeVessels();

  // Update chevron count
  const label = document.getElementById('vesselLabel');
  if (label) {
    label.querySelector('span:first-child') &&
      (label.childNodes[0].textContent = `Vessels${rv.length ? ` · ${rv.length}` : ''} `);
    if (chevron) chevron.textContent = vesselStripOpen ? '▲' : '▼';
  }

  strip.style.display = vesselStripOpen ? '' : 'none';
  if (!vesselStripOpen || !rv.length) { strip.innerHTML = ''; return; }

  strip.innerHTML = '<div class="vessel-live-strip">' +
    rv.map(v => {
      const eta = parseWSDot(v.Eta);
      const sub = v.AtDock
        ? `Docked · ${v.DepartingTerminalAbbrev || ''}`
        : (eta ? `ETA ${fmtTime(eta)}` : `${Math.round(v.Speed || 0)} kts`);
      const vcolor = getVesselColor(v.VesselName);
      return `<div class="vessel-chip" data-vid="${v.VesselID}" style="border-color:${vcolor}22">
        <span class="chip-dot" style="background:${vcolor}"></span>
        <span class="chip-name" style="color:${vcolor}">${v.VesselName}</span>
        <span class="chip-sub">${sub}</span>
      </div>`;
    }).join('') + '</div>';

}


function initMap() {}

function initMapPopup() {
  const markersG = document.getElementById('vessel-markers');
  const popup    = document.getElementById('map-popup');
  if (!markersG || !popup) return;

  function show(vname) {
    const v = routeVessels().find(x => x.VesselName === vname);
    if (!v) return;
    const color = getVesselColor(vname);
    document.getElementById('map-popup-name').textContent = vname;
    document.getElementById('map-popup-name').style.color = color;
    const from  = v.DepartingTerminalID === TERMINALS.SEA.id ? 'Seattle' : 'Bainbridge';
    const to    = v.ArrivingTerminalID  === TERMINALS.SEA.id ? 'Seattle' : 'Bainbridge';
    const eta   = v.Eta      ? parseWSDot(v.Eta)      : null;
    const left  = v.LeftDock ? parseWSDot(v.LeftDock) : null;
    const mins  = eta ? Math.round((eta - Date.now()) / 60000) : null;
    const etaStr = eta  ? `${fmtTime(eta)} (${mins > 0 ? mins + 'm' : 'now'})` : '—';
    const depStr = left ? fmtTime(left) : null;
    const speed  = v.Speed != null ? `${v.Speed.toFixed(1)} kts` : null;
    document.getElementById('map-popup-body').innerHTML =
      `<div class="map-popup-row"><b>${from}</b> → <b>${to}</b></div>` +
      (depStr ? `<div class="map-popup-row">Dep&nbsp;<b>${depStr}</b></div>` : '') +
      `<div class="map-popup-row">ETA&nbsp;<b>${etaStr}</b></div>` +
      (speed  ? `<div class="map-popup-row"><b>${speed}</b></div>` : '');
    popup.classList.add('visible');
  }

  function hide() { popup.classList.remove('visible'); }

  markersG.addEventListener('click',    e => { const g = e.target.closest('[data-vname]'); if (g) { e.stopPropagation(); show(g.getAttribute('data-vname')); } });
  markersG.addEventListener('touchend', e => { const g = e.target.closest('[data-vname]'); if (g) { e.preventDefault(); e.stopPropagation(); show(g.getAttribute('data-vname')); } });
  document.getElementById('map-popup-close')?.addEventListener('click', hide);
  document.getElementById('ferry-map-svg')?.addEventListener('click', e => { if (!e.target.closest('[data-vname]')) hide(); });
}

function updateMap() {
  const routePath = document.getElementById('route-path');
  const markersG  = document.getElementById('vessel-markers');
  const dotsBi    = document.getElementById('term-dots-bi');
  const dotsSea   = document.getElementById('term-dots-sea');
  if (!routePath || !markersG) return;

  const L  = routePath.getTotalLength();
  const rv = routeVessels();
  const parts = [];
  const dockedAtBI  = [];
  const dockedAtSEA = [];

  rv.forEach(v => {
    const color = getVesselColor(v.VesselName);
    const seaBI = v.DepartingTerminalID === TERMINALS.SEA.id;

    if (v.AtDock) {
      (seaBI ? dockedAtSEA : dockedAtBI).push(v);
      return;
    }

    const left = parseWSDot(v.LeftDock);
    const eta  = v.Eta ? parseWSDot(v.Eta) : null;
    let t;
    if (left && eta) {
      const prog = Math.max(0, Math.min(1, (Date.now() - left) / (eta - left)));
      t = seaBI ? L * (1 - prog) : L * prog;
    } else {
      t = L / 2;
    }

    const pt = routePath.getPointAtLength(t);
    const p1 = routePath.getPointAtLength(Math.max(0, t - 1));
    const p2 = routePath.getPointAtLength(Math.min(L, t + 1));
    const rawAng = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI + 90;
    const ang    = seaBI ? rawAng + 180 : rawAng;
    // Offset perpendicular to path: BI→SEA lane is below, SEA→BI lane is above
    const tdx = p2.x - p1.x, tdy = p2.y - p1.y, tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
    const LANE = 7; // SVG units; CCW rotation gives "below" for a rightward path in SVG coords
    const laneSign = seaBI ? -1 : 1;
    const mx = pt.x + (-tdy / tlen) * LANE * laneSign;
    const my = pt.y + ( tdx / tlen) * LANE * laneSign;
    const sf = `drop-shadow(0 0 6px color-mix(in srgb,${color} 55%,transparent)) drop-shadow(0 0 14px color-mix(in srgb,${color} 28%,transparent))`;
    parts.push(
      `<g transform="translate(${mx.toFixed(1)},${my.toFixed(1)})" data-vname="${v.VesselName}" style="cursor:pointer">` +
      `<g transform="rotate(${ang.toFixed(1)}) translate(-20,-20)" style="color:${color};filter:${sf}">` +
      `<svg width="40" height="40" viewBox="0 0 64 64" overflow="visible" style="display:block">` +
      `<path fill="currentColor" d="M32 5C40 13,44 21,44 29L44 54C44 57,42 59,39 59L25 59C22 59,20 57,20 54L20 29C20 21,24 13,32 5Z"/>` +
      `<path fill="#0b1a2e" fill-opacity=".32" d="M32 13C37.5 19,40 25,40 30L40 51C40 53,38.5 54.5,36.5 54.5L27.5 54.5C25.5 54.5,24 53,24 51L24 30C24 25,26.5 19,32 13Z"/>` +
      `<circle cx="32" cy="24" r="3.4" fill="#0b1a2e"/></svg></g></g>`
    );
  });

  markersG.innerHTML = parts.join('');

  function updateTermLabel(termId, vessels, cX, cW, cTX, dotCY) {
    const g = document.getElementById(termId);
    if (!g) return;
    const N = vessels.length;
    const rightDotCX = cTX - 22;
    const leftDotCX  = rightDotCX - (N > 0 ? (N - 1) * 11 : 0);
    const extra = N > 0 ? Math.max(0, cX - (leftDotCX - 7)) : 0;
    g.querySelector('rect').setAttribute('x',    String(cX - extra));
    g.querySelector('rect').setAttribute('width', String(cW + extra));
    g.querySelector('text').setAttribute('x',    String(cTX));
    g.querySelector('g').innerHTML = vessels.map((v, i) => {
      const c = getVesselColor(v.VesselName), cx = rightDotCX - (N - 1 - i) * 11, d = (i * 0.4).toFixed(1);
      return `<circle cx="${cx}" cy="${dotCY}" r="3.5" fill="${c}">` +
        `<animate attributeName="r" values="3;5;3" dur="2.2s" begin="${d}s" repeatCount="indefinite"/>` +
        `<animate attributeName="opacity" values="1;0.45;1" dur="2.2s" begin="${d}s" repeatCount="indefinite"/></circle>`;
    }).join('');
  }
  updateTermLabel('term-bi',  dockedAtBI,  547, 44, 569, 427);
  updateTermLabel('term-sea', dockedAtSEA, 848, 52, 874, 471);
}

// ── Status bar ────────────────────────────────────────────
function setLoadingMsg(msg) {
  const el = document.getElementById('loadingMsg');
  if (el) el.textContent = msg;
}

function setStatus(state) {
  const dot  = document.getElementById('liveDot');
  const text = document.getElementById('liveText');
  if (state === 'loading')  { dot.className = 'live-dot off';     text.textContent = 'Refreshing…'; }
  else if (state === 'live')    { dot.className = 'live-dot live';    text.textContent = lastUpdate ? `Updated ${elapsed(lastUpdate)}` : 'Live'; }
  else if (state === 'partial') { dot.className = 'live-dot partial'; text.textContent = 'Schedule · vessels offline'; }
  else if (state === 'stale')   { dot.className = 'live-dot stale';   text.textContent = lastUpdate ? `Stale · ${elapsed(lastUpdate)}` : 'Offline'; }
}

function showError(msg) {
  if (!schedData) {
    document.getElementById('schedContent').innerHTML =
      `<div class="err-card">⚠ ${msg} <small>Tap ↺ to retry</small></div>`;
  }
  setStatus('stale');
}

// ── Refresh ───────────────────────────────────────────────
async function refresh(forceSchedReload) {
  if (isLoading) return;
  isLoading = true;
  setStatus('loading');
  document.getElementById('refreshBtn').classList.add('spinning');

  try {
    const needSched = forceSchedReload || !schedData;

    setLoadingMsg(needSched ? 'Connecting to WSDOT API…' : 'Refreshing vessels…');

    // All four calls run in parallel. loadSchedule uses scheduletoday/7/3 (terminal IDs)
    // so it has no dependency on schedroutes completing first.
    const fetches = [loadVessels(), fetchBulletins()];
    if (needSched) fetches.push(loadSchedRoutes(), loadSchedule());

    // Hard cap: if ANY fetch hangs past 15s the whole refresh fails visibly
    const masterTimeout = new Promise((_, rej) =>
      setTimeout(() => { setLoadingMsg('⏱ 25s timeout reached — no response from WSDOT'); rej(new Error('Ferry data timed out after 25s')); }, 25000)
    );
    const results = await Promise.race([Promise.allSettled(fetches), masterTimeout]);

    const vesselsOk = results[0].status === 'fulfilled' && Array.isArray(results[0].value);
    const bulletinsOk = results[1].status === 'fulfilled' && Array.isArray(results[1].value);
    vesselList   = vesselsOk   ? results[0].value : [];
    bulletinData = bulletinsOk ? results[1].value : [];
    if (needSched) {
      if (results[2]?.status === 'fulfilled') processSchedRoutes(results[2].value);
      if (results[3]?.status === 'fulfilled') schedData = results[3].value;
    }

    setLoadingMsg(`Vessels: ${vesselsOk ? `${vesselList.length} found` : `✗ ${results[0].reason?.message||'failed'}`} | Bulletins: ${bulletinsOk ? '✓' : '✗'} | Sched: ${schedData ? `✓ ${schedData.TerminalCombos?.length||0} combos` : '✗ none'}`);

    if (!schedData) throw new Error(`No schedule data — vessels ${vesselsOk?'ok':'failed'}, bulletins ${bulletinsOk?'ok':'failed'}`);

    lastUpdate = new Date();
    renderSchedule();
    renderAlerts();
    renderVesselStrip();
    updateMap();
    // Show amber "partial" state when vessel API failed but schedule is available
    setStatus(vesselsOk ? 'live' : 'partial');

  } catch (e) {
    console.error('Refresh error:', e);
    showError(e.message || 'Could not load ferry data.');
  } finally {
    isLoading = false;
    document.getElementById('refreshBtn').classList.remove('spinning');
  }
}

// Refresh stale label without fetching
setInterval(() => { if (lastUpdate) setStatus('live'); }, 60000);

// Auto-refresh: vessels + wait times every 60s; full schedule every 10min
setInterval(() => refresh(false),       60 * 1000);
setInterval(() => refresh(true),   10 * 60 * 1000);

// ── Boot ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('buildTag').textContent = BUILD;
  initMap();
  initMapPopup();

  // Render cached schedule immediately so the UI appears without waiting for API
  const bootCache = getCachedSchedule();
  if (bootCache) {
    schedData = bootCache;
    renderSchedule();
  }

  // fetch live vessels + wait times; only reload schedule if not cached
  refresh(!bootCache);

  document.getElementById('refreshBtn').addEventListener('click', () => refresh(true));

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.dir === direction) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      direction = tab.dataset.dir;
      schedOpen = false;
      renderAlerts();
      if (schedData) renderSchedule();
    });
  });

  document.getElementById('vesselLabel').addEventListener('click', () => {
    vesselStripOpen = !vesselStripOpen;
    renderVesselStrip();
  });

  const tipKey = 'ferry_tip_v1';
  if (localStorage.getItem(tipKey) || window.navigator.standalone) {
    document.getElementById('homeTip').classList.add('hidden');
  }
  document.getElementById('closeTip').addEventListener('click', () => {
    document.getElementById('homeTip').classList.add('hidden');
    localStorage.setItem(tipKey, '1');
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh(false);
  });
});
</script>
