name: WSDOT API Snapshot

on:
  push:
    paths:
      - 'api-snapshots/request.txt'
  workflow_dispatch:
    inputs:
      keywords:
        description: "What to fetch: vessels, schedule, or all"
        required: false
        default: "all"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Override request.txt if workflow_dispatch keyword provided
        if: github.event_name == 'workflow_dispatch' && inputs.keywords != ''
        run: echo "${{ inputs.keywords }}" > api-snapshots/request.txt

      - name: Fetch WSDOT API data
        env:
          WSDOT_API_KEY: ${{ secrets.WSDOT_API_KEY || '7d7a5056-0f82-4547-a870-6db3db67b9d7' }}
        run: python3 .github/scripts/wsdot_snapshot.py

      - name: Commit snapshots to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api-snapshots/
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "chore: WSDOT API snapshot [skip ci]" && git push
